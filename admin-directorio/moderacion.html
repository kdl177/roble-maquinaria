<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F6F4EF">
  <title>Moderación — ROBLE Admin</title>
  <meta name="description" content="Cola de revisión de ROBLE: altas de empresa, productos, imágenes y usuarios pendientes.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/archivo-100-900-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/roble.css">
  <link rel="stylesheet" href="../admin/admin.css">
  <style>@media (max-width: 480px) { .page-title h1 { font-size: 1.375rem; } } @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }</style>
</head>
<body>
  <main id="main" class="admin-main">
    <div class="page-title"><div><h1>Moderación <span class="count" id="count"></span></h1><p>Todo lo que espera una decisión. Aprobar autoriza la cuenta de la empresa y publica su ficha; rechazar avisa a quien lo envió y la deja sin acceso.</p></div></div>
    <div class="tabs" role="tablist" id="tabs" style="margin-bottom:12px"></div>
    <div class="tbar"><select class="select" id="f-estado" aria-label="Estado"><option value="pendiente">Pendientes</option><option value="aprobada">Aprobadas</option><option value="rechazada">Rechazadas</option><option value="">Todas</option></select></div>
    <div class="queue" id="queue"></div>

    <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-title">
      <div class="drawer-head"><h2 id="dr-title">Revisar</h2><button class="btn btn-ghost btn-icon btn-sm" data-close aria-label="Cerrar"><svg class="i"><use href="#i-x"/></svg></button></div>
      <div class="drawer-body" id="dr-body"></div>
      <div class="drawer-foot" id="dr-foot"></div>
    </aside>
  </main>
  <script src="/api/datos.js?panel=1"></script>
  <script src="../assets/roble.js"></script>
  <script src="../admin/admin.js"></script>
  <script>
    Admin.ready.then(() => {
      const who = Admin.shell('moderacion'); if (!who) return;
      const R = ROBLE, S = Admin.Store, $ = s => document.querySelector(s);
      let tab = R.qs().get('tab') || 'altas';
      const counts = () => ({ altas: S.altas().filter(a => a.estado === 'pendiente').length, empresas: S.empresas().filter(e => e.origen !== 'alta' && e.estado === 'pendiente').length });
      const dr = R.drawer('drawer');
      function items() {
        const est = $('#f-estado').value;
        if (tab === 'altas') return S.altas().filter(a => !est || a.estado === est).map(a => ({ id: a.id, tipo: 'alta', nombre: a.nombre, sub: `Alta de empresa · ${(R.sector(a.sector) || {}).corto || a.sector || 'Sin sector todavía'}${a.ciudad ? ' · ' + a.ciudad : ''} · ${a.email || ''}`, fecha: a.fecha, estado: a.estado, raw: a }));
        if (tab === 'empresas') return S.empresas().filter(e => e.origen !== 'alta').filter(e => est ? (est === 'pendiente' ? e.estado === 'pendiente' : est === 'aprobada' ? e.estado === 'publicada' : e.estado === 'rechazada') : true).map(e => ({ id: e.id, tipo: 'empresa', nombre: e.nombre, sub: `${(R.sector(e.sector) || {}).corto || ''}${R.zona(e) ? ' · ' + R.zona(e) : ''} · ${R.ref(e)}`, fecha: e.actualizada, estado: e.estado === 'publicada' ? 'aprobada' : e.estado, raw: e }));
        if (tab === 'productos') return S.productos().filter(p => est ? (est === 'pendiente' ? p.estado === 'pendiente' : est === 'aprobada' ? p.estado === 'publicado' : p.estado === 'rechazado') : true).map(p => ({ id: p.id, tipo: 'producto', nombre: p.titulo, sub: `${p.empresa} · ${p.sub || (R.sector(p.sector) || {}).corto || ''}`, fecha: null, estado: p.estado === 'publicado' ? 'aprobada' : p.estado, raw: p }));
        if (tab === 'usuarios') return S.usuarios().filter(u => est ? (est === 'pendiente' ? u.estado === 'pendiente' : est === 'aprobada' ? u.estado === 'activo' : u.estado === 'inactivo') : true).filter(u => u.rol !== 'empresa' || est === 'pendiente' || !est).slice(0, 50).map(u => ({ id: u.id, tipo: 'usuario', nombre: u.nombre, sub: `${u.rol} · ${u.email || 'sin correo'}`, fecha: null, estado: u.estado === 'activo' ? 'aprobada' : u.estado === 'inactivo' ? 'rechazada' : u.estado, raw: u }));
        return [];
      }
      function render() {
        const c = counts(); const total = c.altas + c.empresas; $('#count').textContent = total;
        $('#tabs').innerHTML = [['altas', 'Altas'], ['empresas', 'Empresas']].map(([id, l]) => `<button class="tab" role="tab" data-tab="${id}" aria-selected="${tab === id}">${l} <span class="count">${c[id]}</span></button>`).join('');
        const list = items();
        $('#queue').innerHTML = list.length ? list.map(it => `<div class="qrow"><div class="logo-tile">${R.esc(R.iniciales(it.nombre))}</div><div class="q-main"><b>${R.esc(it.nombre)} ${Admin.status(it.estado)}</b><span>${R.esc(it.sub)}${it.fecha ? ' · ' + Admin.ago(it.fecha) : ''}</span></div><div class="q-actions"><button class="btn btn-sm" data-ver="${it.id}">Ver</button>${it.estado === 'pendiente' ? `<button class="btn btn-sm btn-ink" data-ok="${it.id}">Aprobar</button><button class="btn btn-sm btn-danger" data-no="${it.id}">Rechazar</button>` : ''}</div></div>`).join('')
          : `<div class="empty">${R.icon(tab === 'imagenes' ? 'image' : 'check')}<p class="empty-title">${tab === 'imagenes' ? 'Ninguna imagen pendiente' : 'Nada que revisar aquí'}</p><p>${tab === 'imagenes' ? 'Las fotos que suban las empresas pasan por esta cola antes de publicarse.' : tab === 'altas' ? 'Las altas que lleguen desde la web aparecen aquí. Buen momento para revisar altas antiguas.' : 'Todo lo de esta cola está resuelto.'}</p></div>`;
      }
      function aprobar(it) {
        if (it.tipo === 'alta') { Admin.aprobarAlta(it.raw); R.toast(`${it.nombre} publicada`); }
        else if (it.tipo === 'empresa') { S.setEmpresa(it.id, { estado: 'publicada' }); S.log(`Empresa aprobada: ${it.nombre}`, 'ok'); R.toast('Empresa publicada'); }
        else if (it.tipo === 'producto') { S.setProducto(it.id, { estado: 'publicado' }); S.log(`Producto aprobado: ${it.nombre}`, 'ok'); R.toast('Producto publicado'); }
        else if (it.tipo === 'usuario') { S.setUsuario(it.id, { estado: 'activo' }); S.log(`Usuario activado: ${it.nombre}`, 'ok'); R.toast('Usuario activado'); }
        dr.close(); render();
      }
      async function rechazar(it, motivo) {
        if (motivo === undefined) { const ok = await R.confirmDialog({ title: 'Rechazar', html: `Vas a rechazar <strong>${R.esc(it.nombre)}</strong>. ${it.tipo === 'alta' ? 'Avisaremos por correo a quien envió el alta.' : 'Dejará de mostrarse en la web.'}`, ok: 'Rechazar', danger: true }); if (!ok) return; motivo = ''; }
        if (it.tipo === 'alta') Admin.rechazarAlta(it.raw, motivo);
        else if (it.tipo === 'empresa') { S.setEmpresa(it.id, { estado: 'rechazada', motivo }); S.log(`Empresa rechazada: ${it.nombre}`, 'error'); }
        else if (it.tipo === 'producto') { S.setProducto(it.id, { estado: 'rechazado', motivo }); S.log(`Producto rechazado: ${it.nombre}`, 'error'); }
        else if (it.tipo === 'usuario') { S.setUsuario(it.id, { estado: 'inactivo' }); S.log(`Usuario desactivado: ${it.nombre}`, 'error'); }
        R.toast('Rechazado'); dr.close(); render();
      }
      function ver(it) {
        const r = it.raw; $('#dr-title').textContent = it.nombre;
        const rows = it.tipo === 'alta' ? [['Tipo', 'Alta de empresa'], ['Sector', R.esc((R.sector(r.sector) || {}).corto || r.sector || '—')], ['Subsector', R.esc(r.sub || '—')], ['Ciudad', R.esc(r.ciudad || '—')], ['País', R.esc(R.pais[r.pais] || r.pais || '—')], ['Web', R.webHref(r.web) ? `<a href="${R.esc(R.webHref(r.web))}" target="_blank" rel="noopener">${R.esc(r.web)}</a>` : R.esc(r.web || '—')], ['Correo', `<a href="mailto:${R.esc(r.email)}">${R.esc(r.email)}</a>`], ['Recibida', Admin.fmtDate(r.fecha)], ['Estado', Admin.status(r.estado)]]
          : it.tipo === 'empresa' ? [['Tipo', 'Empresa'], ['Sector', (R.sector(r.sector) || {}).corto || '—'], ['Zona', R.esc(R.zona(r) || '—')], ['Web', R.webHref(r.web) ? `<a href="${R.esc(R.webHref(r.web))}" target="_blank" rel="noopener">${R.esc(r.web)}</a>` : R.esc(r.web || '—')], ['Plan', R.esc(r.plan || 'gratuito')], ['Estado', Admin.status(r.estado)]]
          : it.tipo === 'producto' ? [['Tipo', 'Producto'], ['Empresa', R.esc(r.empresa || '—')], ['Sector', (R.sector(r.sector) || {}).corto || '—'], ['Subsector', R.esc(r.sub || '—')], ['Fotos', String((r.fotos || []).length)], ['Estado', Admin.status(r.estado)]]
          : [['Tipo', 'Usuario'], ['Rol', R.esc(r.rol || '—')], ['Correo', R.esc(r.email || '—')], ['Estado', Admin.status(r.estado)]];
        $('#dr-body').innerHTML = `<dl class="specs detail">${rows.map(([k, v]) => `<div class="spec"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>${r.desc ? `<div><span class="label" style="display:block;margin-bottom:6px">Descripción</span><div class="msg">${R.esc(r.desc)}</div></div>` : ''}${it.estado === 'pendiente' ? `<div class="field"><label for="motivo">Motivo si rechazas</label><select class="select" id="motivo"><option value="">Sin motivo concreto</option><option>No es una empresa del sector de la madera</option><option>Datos incompletos o no verificables</option><option>Duplicada: ya existe en el directorio</option><option>Contenido inapropiado</option></select></div>` : (r.motivo ? `<div class="alert alert-error"><svg class="i"><use href="#i-warning"/></svg><div><strong>Motivo del rechazo.</strong> ${R.esc(r.motivo)}</div></div>` : '')}`;
        $('#dr-foot').innerHTML = it.estado === 'pendiente' ? `<span class="status status-pending">Pendiente</span><div class="row"><button class="btn btn-danger" id="d-no">Rechazar</button><button class="btn btn-ink" id="d-ok">Autorizar y publicar</button></div>` : `<span></span><div class="row">${it.tipo === 'empresa' || (it.tipo === 'alta' && r.empresa_id) ? `<a class="btn" href="empresas.html?id=${it.tipo === 'empresa' ? it.id : r.empresa_id}">Abrir ficha</a>` : ''}<button class="btn btn-ghost" data-close>Cerrar</button></div>`;
        $('#dr-foot').querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', dr.close));
        const ok = $('#d-ok'), no = $('#d-no'); ok && ok.addEventListener('click', () => aprobar(it)); no && no.addEventListener('click', () => rechazar(it, $('#motivo').value));
        dr.open();
      }
      document.addEventListener('click', ev => {
        const tb = ev.target.closest('[data-tab]'); if (tb) { tab = tb.dataset.tab; history.replaceState(null, '', 'moderacion.html?tab=' + tab); render(); return; }
        const a = ev.target.closest('[data-ver],[data-ok],[data-no]'); if (!a) return;
        const id = a.dataset.ver || a.dataset.ok || a.dataset.no; const it = items().find(x => String(x.id) === id); if (!it) return;
        if (a.dataset.ver) ver(it); else if (a.dataset.ok) aprobar(it); else rechazar(it);
      });
      $('#f-estado').addEventListener('change', render);
      render();
    });
  </script>
</body>
</html>
